name: Refresh MySteel fast news

on:
  schedule:
    # GitHub Actions 使用 UTC：北京时间 08:10 = 00:10，09:00 = 01:00。
    - cron: '10 0 * * *'
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mysteel-fast-news
  cancel-in-progress: false

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Sync scheduled morning news snapshots
        continue-on-error: true
        env:
          TIDE_TRANSLATE_ENDPOINT: ${{ secrets.TIDE_TRANSLATE_ENDPOINT }}
          TIDE_TRANSLATE_API_KEY: ${{ secrets.TIDE_TRANSLATE_API_KEY }}
        run: node data-ingestion/sync-all.mjs ${{ github.event.schedule == '0 1 * * *' && '--only=mysteel-fast-news,tide-global-news' || '--only=mysteel-fast-news' }}

      - name: Commit updated news snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/data/external_fast_news.json frontend/public/data/external_tide_news.json frontend/public/data/data_sync_status.json frontend/public/data/brief_history.json
          if git diff --cached --quiet; then
            echo "没有新的 MySteel 快讯快照需要提交"
          else
            git commit -m "data: refresh mysteel fast news"
            git push origin HEAD:main
          fi

      - name: Build static site
        working-directory: frontend
        run: npm run test:smoke

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: offline-demo

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
